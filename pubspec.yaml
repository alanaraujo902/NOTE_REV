name: card_deck_app
description: "Aplicativo de baralhos e cartões com edição avançada"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # Banco de dados SQLite
  sqflite: ^2.3.0
  path: ^1.8.3
  
  # Editor de Markdown
  flutter_markdown: ^0.6.18
  markdown: ^7.1.1
  
  # Desenho e pintura
  signature: ^5.4.0
  flutter_colorpicker: ^1.0.3
  
  # Manipulação de imagens
  image_picker: ^1.0.4
  image: ^4.1.3
  
  # Player de áudio
  audioplayers: ^5.2.1
  
  # Gerenciamento de estado
  provider: ^6.1.1
  
  # Utilitários
  uuid: ^4.1.0
  intl: ^0.18.1
  
  # Permissões
  permission_handler: ^11.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/audio/

